<style>
/* Layout: one 1970s station terminal. Phosphor-green text on a dark CRT with scanlines; prompt-style question, bracketed options, and a mechanical black-and-white split-flap counter. Deliberately single dark theme. */
:root{
  --room:#050605;      /* page behind the screen */
  --crt:#0c0f0c;       /* screen glass */
  --phos:#a8c59c;      /* phosphor text */
  --dim:#667d5d;       /* dim phosphor */
  --rule:#232e21;      /* faint lines */
  --bad:#e0805f;       /* error text */
  --tile:#0d0d0d; --tile-hi:#1a1a1a; --digit:#f1efe8; --housing:#2b2b27;
  --f-term:"VT323","Courier New",ui-monospace,monospace;
  --f-flap:"Oswald","Arial Narrow",Impact,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--room);color:var(--phos);font-family:var(--f-term);font-size:22px;line-height:1.25;padding:0 16px;text-shadow:0 0 5px rgba(168,197,156,.45)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.wrap{max-width:600px;margin:0 auto;padding-block:24px 40px}
.screen{background:var(--crt);border:2px solid var(--rule);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:inset 0 0 60px rgba(0,0,0,.8),0 0 0 6px #121410,0 0 0 8px #1c1f19}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:1px dashed var(--dim);padding-bottom:10px}
h1{font-weight:400;font-size:2.4rem;letter-spacing:.14em;margin:0;line-height:.9}
.meta{font-size:1rem;color:var(--dim);text-align:right;line-height:1.1}
.meta b{color:var(--phos);font-weight:400}

.progress{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;font-size:1.15rem}
.pip{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.pip.now{color:var(--room);background:var(--phos);text-shadow:none}
.pip.good{color:var(--phos)}
.pip.bad{color:var(--bad);text-shadow:0 0 5px rgba(224,128,95,.45)}

.card{display:flex;flex-direction:column;gap:14px}
.era{font-size:1rem;color:var(--dim);display:flex;justify-content:space-between;gap:8px;text-transform:uppercase;letter-spacing:.06em}
.q{font-size:1.5rem;line-height:1.2;margin:0;min-height:2.4em}
.q::before{content:">: ";color:var(--dim)}
.cur::after{content:"█";animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.opts{display:grid;gap:6px}
.opt{font:inherit;font-size:1.25rem;color:var(--phos);text-shadow:inherit;text-align:left;background:transparent;border:0;padding:4px 8px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt .k{color:var(--dim);flex:none}
.opt:hover:not(:disabled),.opt:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}
.opt:hover:not(:disabled) .k,.opt:focus-visible .k{color:var(--crt)}
.opt:disabled{cursor:default}
.opt.right{background:var(--phos);color:var(--crt);text-shadow:none}
.opt.right .k{color:var(--crt)}
.opt.right::after{content:"  ACCEPTED";margin-left:auto;padding-left:10px}
.opt.wrong{color:var(--bad)}
.opt.wrong .k{color:var(--bad)}
.opt.wrong::after{content:"  REJECTED";margin-left:auto;padding-left:10px}
.opt.dim{opacity:.4}
.next{align-self:flex-end;font:inherit;font-size:1.3rem;color:var(--phos);text-shadow:inherit;background:transparent;border:1px solid var(--phos);padding:2px 12px;cursor:pointer}
.next:hover,.next:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}

.intro{min-height:15em;gap:8px;cursor:default}
.ln{margin:0;min-height:1.25em;font-size:1.3rem;white-space:pre-wrap}
.ln::before{content:">: ";color:var(--dim)}
.ln.bar{color:var(--dim);font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:pre;overflow:hidden}
@media (max-width:440px){.ln.bar{font-size:.95rem}.ln.big{font-size:2.1rem}}
.ln.bar::before{content:"   "}
.ln.big{font-size:2.6rem;line-height:1;min-height:1em;margin-top:8px}
.ln.big::before{content:""}
.dimln{color:var(--dim)}
.start{align-self:flex-start;font-size:1.7rem;padding:4px 20px;margin-top:10px;animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 rgba(168,197,156,0)}to{box-shadow:0 0 14px rgba(168,197,156,.45)}}
.score{font-size:4.5rem;line-height:.9;margin:0}
.score small{font-size:1.6rem;color:var(--dim)}
.verdict{font-size:1.3rem;margin:0}
.recap{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.recap li{display:grid;grid-template-columns:1.4em 1fr;gap:8px;font-size:1.05rem;color:var(--dim);line-height:1.15}
.recap li b{color:var(--phos);font-weight:400}
.recap .m.g{color:var(--phos)}.recap .m.b{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ghost{font:inherit;font-size:1.15rem;background:transparent;color:var(--phos);text-shadow:inherit;border:1px solid var(--dim);padding:2px 12px;cursor:pointer}
.ghost:hover,.ghost:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}
.toast{font-size:1rem;color:var(--phos)}
textarea.sharebox{width:100%;font:inherit;font-size:1rem;background:var(--room);color:var(--phos);border:1px solid var(--rule);padding:8px;resize:none}

/* Split-flap counter: black tiles, white digits, metal housing */
.counter{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}
.counter .l{font-size:1.05rem;color:var(--dim);letter-spacing:.08em}
.housing{background:linear-gradient(#34342f,var(--housing) 40%,#1d1d1a);padding:10px 12px 8px;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.7);display:flex;gap:6px;align-items:flex-start;text-shadow:none}
.grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.grp .tiles{display:flex;gap:3px}
.grp small{font-family:var(--f-flap);font-size:.55rem;letter-spacing:.2em;color:#a9a79e}
.sep{font-family:var(--f-flap);color:var(--digit);font-size:1.6rem;line-height:3.2rem;width:.4em;text-align:center}
.fd{position:relative;width:2.1rem;height:3.2rem;perspective:200px;font-family:var(--f-flap);font-size:2.3rem;color:var(--digit)}
.fd .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--tile);border-radius:3px}
.fd .h b{display:flex;align-items:center;justify-content:center;height:200%;font-weight:500;line-height:1}
.fd .hi{top:0;background:linear-gradient(var(--tile-hi),var(--tile));border-radius:3px 3px 0 0;transform-origin:bottom}
.fd .lo{bottom:0;border-radius:0 0 3px 3px;transform-origin:top}
.fd .lo b{transform:translateY(-50%)}
.fd::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000;z-index:3}
.fd .flap.hi{z-index:2;animation:ftop .22s ease-in forwards;backface-visibility:hidden}
.fd .flap.lo{z-index:2;transform:rotateX(90deg);animation:fbot .22s .22s ease-out forwards;backface-visibility:hidden}
@keyframes ftop{to{transform:rotateX(-90deg)}}
@keyframes fbot{to{transform:rotateX(0)}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;border-top:1px dashed var(--dim);padding-top:12px}
.stat{display:flex;flex-direction:column}
.stat b{font-weight:400;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.9rem;color:var(--dim);text-transform:uppercase}
footer{font-size:.95rem;color:var(--dim);text-align:center;margin-top:14px}
@media (max-width:440px){body{font-size:20px}h1{font-size:1.9rem}.q{font-size:1.3rem}.score{font-size:3.6rem}.fd{width:1.7rem;height:2.7rem;font-size:1.9rem}.sep{line-height:2.7rem}.stat span{font-size:.75rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Operator bar, account panel, install line */
.opbar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:1.05rem;color:var(--dim);margin-top:-8px}
.opbar b{color:var(--phos);font-weight:400}
.linkbtn{font:inherit;color:var(--phos);text-shadow:inherit;background:transparent;border:0;padding:0 2px;cursor:pointer}
.linkbtn:hover,.linkbtn:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}
.sync{font-size:.9rem;color:var(--dim)}
.sync.err{color:var(--bad)}
.panel{position:fixed;inset:0;z-index:4;background:rgba(3,4,3,.88);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 48px) 16px 24px;overflow-y:auto}
.panel .screen{width:100%;max-width:460px;gap:14px}
.panel h2{font-weight:400;font-size:1.9rem;letter-spacing:.1em;margin:0;line-height:1}
.panel p{margin:0;font-size:1.15rem}
.panel .dimln{font-size:1rem}
.stack{display:grid;gap:10px}
.btn{font:inherit;font-size:1.3rem;color:var(--phos);text-shadow:inherit;background:transparent;border:1px solid var(--phos);padding:6px 12px;cursor:pointer;text-align:left}
.btn:hover:not(:disabled),.btn:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}
.btn:disabled{opacity:.5;cursor:wait}
.btn.quiet{border-color:var(--dim);color:var(--dim)}
.or{color:var(--dim);font-size:1rem;text-align:center}
.field{display:grid;gap:4px}
.field label{font-size:1rem;color:var(--dim)}
.field input{font:inherit;font-size:1.5rem;color:var(--phos);text-shadow:inherit;background:var(--room);border:1px solid var(--dim);border-radius:0;padding:6px 10px;width:100%;caret-color:var(--phos)}
.field input:focus{outline:0;border-color:var(--phos)}
.msg{min-height:1.2em;font-size:1.05rem}
.msg.err{color:var(--bad)}
.install{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:.95rem;color:var(--dim)}
.gbtn{min-height:44px;display:flex;align-items:center;color-scheme:normal;text-shadow:none}
</style>

const NUMS=[4,8,15,16,23,42], PER_DAY=6, EPOCH=new Date(2026,9,9); // day #1
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seed){const a=arr.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const dayNo=Math.max(1,Math.round((today-EPOCH)/864e5)+1);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const key=ymd(today);
function questionsFor(n){
  const per=Math.floor(BANK.length/PER_DAY), idx=n-1, round=Math.floor(idx/per), slot=idx%per;
  const order=shuffle(BANK.map((_,i)=>i),4815+round*162342);
  return order.slice(slot*PER_DAY,slot*PER_DAY+PER_DAY).map((bi,qi)=>{
    const b=BANK[bi]; const opts=shuffle([b[2],b[3],b[4],b[5]],n*108+qi+23);
    return{era:b[0],q:b[1],opts,answer:opts.indexOf(b[2])};
  });
}
const QS=questionsFor(dayNo);

// Split-flap clock: six black tiles (HH MM SS); each changed digit flips its top half down, then the new bottom half falls into place.
let digits=[],tickTimer=null;
function buildClock(){
  const el=$("cd");const grp=lab=>`<div class="grp"><div class="tiles">${'<div class="fd"><div class="h hi"><b>0</b></div><div class="h lo"><b>0</b></div></div>'.repeat(2)}</div><small>${lab}</small></div>`;
  el.innerHTML=grp("HRS")+'<span class="sep">:</span>'+grp("MIN")+'<span class="sep">:</span>'+grp("SEC");
  digits=[...el.querySelectorAll(".fd")].map(node=>({node,v:null}));
}
function setDigit(d,v){
  if(d.v===v)return;const old=d.v===null?v:d.v;d.v=v;const n=d.node;
  const hi=n.querySelector(".hi:not(.flap) b"),lo=n.querySelector(".lo:not(.flap) b");
  n.querySelectorAll(".flap").forEach(f=>f.remove());
  if(reduceMotion||old===v){hi.textContent=v;lo.textContent=v;return}
  hi.textContent=v;lo.textContent=old;
  n.insertAdjacentHTML("beforeend",`<div class="h hi flap"><b>${old}</b></div><div class="h lo flap"><b>${v}</b></div>`);
  setTimeout(()=>{lo.textContent=v;n.querySelectorAll(".flap").forEach(f=>f.remove())},460);
}
function tick(){clearTimeout(tickTimer);if(!$("cd"))return;const t=new Date(today);t.setDate(t.getDate()+1);let ms=t-new Date();if(ms<=0){location.reload();return}
  const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  const str=[h,m,s].map(v=>String(v).padStart(2,"0")).join("");
  digits.forEach((d,i)=>setDigit(d,str[i]));
  tickTimer=setTimeout(tick,1000-(Date.now()%1000)+5)}

// ---------- Stats (computed from the full history, so they match on every device) ----------
function streaks(){
  const days=Object.keys(data.history).filter(k=>data.history[k]&&data.history[k].done).sort();
  let best=0,run=0,prev=null;
  for(const k of days){run=(prev&&Math.round((parseYmd(k)-parseYmd(prev))/864e5)===1)?run+1:1;best=Math.max(best,run);prev=k}
  const y=new Date(today);y.setDate(y.getDate()-1);
  const cur=(prev===key||prev===ymd(y))?run:0;
  return{days,cur,best};
}
function stats(){
  const{days,cur,best}=streaks();
  $("sPlayed").textContent=days.length;
  $("sAvg").textContent=days.length?Math.round(days.reduce((s,k)=>s+(data.history[k].score||0),0)/(days.length*PER_DAY)*100)+"%":"–";
  $("sStreak").textContent=cur;
  $("sBest").textContent=best;
}

  const timers=[];

    for(const id in lines){$(id).textContent=lines[id]();$(id).classList.remove("cur")}

    for(let i=1;i<=t.length;i++){if(introSkipped)return;el.textContent=t.slice(0,i);await wait(speed)}el.classList.remove("cur")}
  (async()=>{
    await wait(300);await type("l0",22);if(introSkipped)return;
    for(let k=0;k<=BLOCKS;k++){if(introSkipped)return;$("bar").textContent=barText(k);await wait(k<14?45:90)}

    await type("l2",28);if(introSkipped)return;await wait(200);

  })();
}

const CFG=window.DHARMA_CONFIG||{};

const sb=cloudOn?window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}}):null;

function setSync(text,err){const el=$("opSync");el.textContent=text?`· ${text}`:"";el.classList.toggle("err",!!err)}

const better=(a,b)=>{if(!a)return b;if(!b)return a;if(!!a.done!==!!b.done)return a.done?a:b;return(a.picks?.length||0)>=(b.picks?.length||0)?a:b};
const sameDay=(a,b)=>a&&b&&!!a.done===!!b.done&&(a.picks||[]).join()===(b.picks||[]).join();

async function syncAll(){
  const uid=session.user.id;setSync("SYNCING");
  const{data:rows,error}=await sb.from("results").select("day,picks,score,done").eq("user_id",uid);
  if(error)throw error;
  const remote={};rows.forEach(r=>remote[r.day]={picks:r.picks||[],score:r.score||0,done:!!r.done});
  const up=[];
  new Set([...Object.keys(remote),...Object.keys(data.history)]).forEach(k=>{
    const l=data.history[k],r=remote[k],w=better(l,r);
    data.history[k]={picks:[...(w.picks||[])],score:w.score||0,done:!!w.done};
    if(!sameDay(data.history[k],r))up.push({user_id:uid,day:k,...data.history[k]});
  });
  if(up.length){const{error:e2}=await sb.from("results").upsert(up,{onConflict:"user_id,day"});if(e2)throw e2}
  save(data);setSync("SYNCED");
}
let pushChain=Promise.resolve();
function pushDay(k){
  if(!sb||!session)return;
  const row={user_id:session.user.id,day:k,picks:data.history[k].picks,score:data.history[k].score||0,done:!!data.history[k].done};
  setSync("SAVING");
  pushChain=pushChain.then(()=>sb.from("results").upsert(row,{onConflict:"user_id,day"})).then(({error})=>setSync(error?"NOT SAVED":"SYNCED",!!error)).catch(()=>setSync("OFFLINE",true));
}
async function loadProfile(){
  const{data:p,error}=await sb.from("profiles").select("username").eq("id",session.user.id).maybeSingle();
  if(error)throw error;profile=p||null;
}
async function onSession(){
  renderOperator();
  if(!session){profile=null;syncedFor=null;return}
  if(syncedFor===session.user.id)return;
  syncedFor=session.user.id;
  try{await loadProfile();renderOperator();await syncAll();refresh()}
  catch(e){setSync("OFFLINE",true);syncedFor=null}
  if(!profile)openPanel("username");
}
const ready=(async()=>{
  renderOperator();
  if(!sb)return;
  try{const{data:{session:s}}=await sb.auth.getSession();session=s;await onSession()}catch(e){}
  sb.auth.onAuthStateChange((event,s)=>{
    // Run outside the callback: the auth client must not be awaited from inside it.
    setTimeout(async()=>{
      if(event==="SIGNED_OUT"){session=null;profile=null;syncedFor=null;data={history:{}};save(data);renderOperator();refresh();return}
      session=s;if(event==="SIGNED_IN"||event==="INITIAL_SESSION")await onSession();else renderOperator();
    },0);
  });
})();

async function sha256hex(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

      <p class="msg" id="pMsg" aria-live="polite"></p>
      <button class="btn quiet" id="pBack" type="button">[ CHANGE EMAIL ]</button>`;
    $("pCodeForm").onsubmit=async e=>{e.preventDefault();const token=$("pCode").value.replace(/\s/g,"");
      if(token.length<6){panelMsg("Enter the full code from the email.",true);return}
      busy(true);panelMsg("VERIFYING...");
      const{error}=await sb.auth.verifyOtp({email:pendingEmail,token,type:"email"});
      busy(false);
      if(error){panelMsg("That code didn't work. Check it, or request a new one.",true);return}
      panelMsg("ACCESS GRANTED.");setTimeout(()=>{if(!$("panel").hidden&&$("pCode"))closePanel()},700)};
    $("pBack").onclick=()=>openPanel("login");
    $("pCode").focus();
  }
  else if(kind==="username"){
    P.innerHTML=`<h2 id="panelTitle">CHOOSE AN OPERATOR NAME</h2>
      <p class="dimln">This is your username. 3 to 16 letters, numbers or underscores.</p>
      <form class="stack" id="pNameForm" novalidate>
        <div class="field"><label for="pName">USERNAME</label><input id="pName" type="text" autocomplete="username" maxlength="16" autocapitalize="off" spellcheck="false" value="${esc(profile?.username||"")}" required></div>
        <button class="btn" type="submit">&gt; CONFIRM</button>
      </form>
      <p class="msg" id="pMsg" aria-live="polite"></p>
      ${profile?'<button class="btn quiet" id="pBack" type="button">[ BACK ]</button>':""}`;
    $("pNameForm").onsubmit=async e=>{e.preventDefault();const name=$("pName").value.trim();
      if(!/^[A-Za-z0-9_]{3,16}$/.test(name)){panelMsg("Use 3 to 16 letters, numbers or underscores.",true);return}
      busy(true);panelMsg("REGISTERING...");
      const{error}=await sb.from("profiles").upsert({id:session.user.id,username:name});
      busy(false);
      if(error){panelMsg(error.code==="23505"?"That name is taken. Try another.":error.message,true);return}
      profile={username:name};renderOperator();closePanel()};
    $("pBack")&&($("pBack").onclick=()=>openPanel("account"));
    $("pName").focus();
  }
  else if(kind==="account"){
    const who=session?.user?.email||"";
    P.innerHTML=`<h2 id="panelTitle">OPERATOR ${esc((profile?.username||"").toUpperCase())}</h2>
      <p class="dimln">${esc(who)}</p>
      <p>Your games and streaks are saved to your account.</p>
      <div class="stack">
        <button class="btn" id="pRename" type="button">&gt; CHANGE USERNAME</button>
        <button class="btn" id="pOut" type="button">&gt; LOG OUT</button>
      </div>
      <p class="msg" id="pMsg" aria-live="polite"></p>
      <button class="btn quiet" id="pClose" type="button">[ CLOSE ]</button>`;
    $("pRename").onclick=()=>openPanel("username");
    $("pOut").onclick=async()=>{busy(true);await sb.auth.signOut();closePanel()};
    $("pClose").onclick=closePanel;
    $("pRename").focus();
  }
}
$("opBtn").onclick=()=>openPanel(session?"account":"login");
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("panel").hidden&&(profile||!session))closePanel()});

// ---------- PWA: offline cache and install prompts ----------
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(function(){
  const row=$("installRow"), standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(standalone)return;
  const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(iOS){row.textContent="INSTALL: TAP SHARE, THEN ADD TO HOME SCREEN";row.hidden=false;return}
  let deferred=null;
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;
    row.innerHTML='<button class="linkbtn" id="installBtn" type="button">[ INSTALL APP ]</button>';row.hidden=false;
    $("installBtn").onclick=async()=>{deferred.prompt();await deferred.userChoice;deferred=null;row.hidden=true}});
  addEventListener("appinstalled",()=>{row.hidden=true});
})();

stats();intro();
</script>
</body>
</html>
