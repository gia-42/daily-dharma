<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}*{box-sizing:border-box}</style>
<style>
/* Layout: one 1970s station terminal. Phosphor-green text on a dark CRT with scanlines; prompt-style question, bracketed options, and a mechanical black-and-white split-flap counter. Deliberately single dark theme. */
:root{
  --room:#050605;      /* page behind the screen */
  --crt:#0c0f0c;       /* screen glass */
  --phos:#a8c59c;      /* phosphor text */
  --dim:#667d5d;       /* dim phosphor */
  --rule:#232e21;      /* faint lines */
  --bad:#e0805f;       /* error text */
  --tile:#0d0d0d; --tile-hi:#1a1a1a; --digit:#f1efe8; --housing:#2b2b27;
  --f-term:"VT323","Courier New",ui-monospace,monospace;
  --f-flap:"Oswald","Arial Narrow",Impact,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--room);color:var(--phos);font-family:var(--f-term);font-size:22px;line-height:1.25;padding:0 16px;text-shadow:0 0 5px rgba(168,197,156,.45)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.wrap{max-width:600px;margin:0 auto;padding-block:24px 40px}
.screen{background:var(--crt);border:2px solid var(--rule);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;box-shadow:inset 0 0 60px rgba(0,0,0,.8),0 0 0 6px #121410,0 0 0 8px #1c1f19}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:1px dashed var(--dim);padding-bottom:10px}
h1{font-weight:400;font-size:2.4rem;letter-spacing:.14em;margin:0;line-height:.9}
.meta{font-size:1rem;color:var(--dim);text-align:right;line-height:1.1}
.meta b{color:var(--phos);font-weight:400}

.progress{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;font-size:1.15rem}
.pip{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.pip.now{color:var(--room);background:var(--phos);text-shadow:none}
.pip.good{color:var(--phos)}
.pip.bad{color:var(--bad);text-shadow:0 0 5px rgba(224,128,95,.45)}

.card{display:flex;flex-direction:column;gap:14px}
.era{font-size:1rem;color:var(--dim);display:flex;justify-content:space-between;gap:8px;text-transform:uppercase;letter-spacing:.06em}
.q{font-size:1.5rem;line-height:1.2;margin:0;min-height:2.4em}
.q::before{content:">: ";color:var(--dim)}
.cur::after{content:"█";animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.opts{display:grid;gap:6px}
.opt{font:inherit;font-size:1.25rem;color:var(--phos);text-shadow:inherit;text-align:left;background:transparent;border:0;padding:4px 8px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt .k{color:var(--dim);flex:none}
.opt:hover:not(:disabled),.opt:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}
.opt:hover:not(:disabled) .k,.opt:focus-visible .k{color:var(--crt)}
.opt:disabled{cursor:default}
.opt.right{background:var(--phos);color:var(--crt);text-shadow:none}
.opt.right .k{color:var(--crt)}
.opt.right::after{content:"  ACCEPTED";margin-left:auto;padding-left:10px}
.opt.wrong{color:var(--bad)}
.opt.wrong .k{color:var(--bad)}
.opt.wrong::after{content:"  REJECTED";margin-left:auto;padding-left:10px}
.opt.dim{opacity:.4}
.next{align-self:flex-end;font:inherit;font-size:1.3rem;color:var(--phos);text-shadow:inherit;background:transparent;border:1px solid var(--phos);padding:2px 12px;cursor:pointer}
.next:hover,.next:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}

.intro{min-height:15em;gap:8px;cursor:default}
.ln{margin:0;min-height:1.25em;font-size:1.3rem;white-space:pre-wrap}
.ln::before{content:">: ";color:var(--dim)}
.ln.bar{color:var(--dim);font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:pre;overflow:hidden}
@media (max-width:440px){.ln.bar{font-size:.95rem}.ln.big{font-size:2.1rem}}
.ln.bar::before{content:"   "}
.ln.big{font-size:2.6rem;line-height:1;min-height:1em;margin-top:8px}
.ln.big::before{content:""}
.dimln{color:var(--dim)}
.start{align-self:flex-start;font-size:1.7rem;padding:4px 20px;margin-top:10px;animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 rgba(168,197,156,0)}to{box-shadow:0 0 14px rgba(168,197,156,.45)}}
.score{font-size:4.5rem;line-height:.9;margin:0}
.score small{font-size:1.6rem;color:var(--dim)}
.verdict{font-size:1.3rem;margin:0}
.recap{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.recap li{display:grid;grid-template-columns:1.4em 1fr;gap:8px;font-size:1.05rem;color:var(--dim);line-height:1.15}
.recap li b{color:var(--phos);font-weight:400}
.recap .m.g{color:var(--phos)}.recap .m.b{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ghost{font:inherit;font-size:1.15rem;background:transparent;color:var(--phos);text-shadow:inherit;border:1px solid var(--dim);padding:2px 12px;cursor:pointer}
.ghost:hover,.ghost:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}
.toast{font-size:1rem;color:var(--phos)}
textarea.sharebox{width:100%;font:inherit;font-size:1rem;background:var(--room);color:var(--phos);border:1px solid var(--rule);padding:8px;resize:none}

/* Split-flap counter: black tiles, white digits, metal housing */
.counter{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}
.counter .l{font-size:1.05rem;color:var(--dim);letter-spacing:.08em}
.housing{background:linear-gradient(#34342f,var(--housing) 40%,#1d1d1a);padding:10px 12px 8px;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 10px rgba(0,0,0,.7);display:flex;gap:6px;align-items:flex-start;text-shadow:none}
.grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.grp .tiles{display:flex;gap:3px}
.grp small{font-family:var(--f-flap);font-size:.55rem;letter-spacing:.2em;color:#a9a79e}
.sep{font-family:var(--f-flap);color:var(--digit);font-size:1.6rem;line-height:3.2rem;width:.4em;text-align:center}
.fd{position:relative;width:2.1rem;height:3.2rem;perspective:200px;font-family:var(--f-flap);font-size:2.3rem;color:var(--digit)}
.fd .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--tile);border-radius:3px}
.fd .h b{display:flex;align-items:center;justify-content:center;height:200%;font-weight:500;line-height:1}
.fd .hi{top:0;background:linear-gradient(var(--tile-hi),var(--tile));border-radius:3px 3px 0 0;transform-origin:bottom}
.fd .lo{bottom:0;border-radius:0 0 3px 3px;transform-origin:top}
.fd .lo b{transform:translateY(-50%)}
.fd::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000;z-index:3}
.fd .flap.hi{z-index:2;animation:ftop .22s ease-in forwards;backface-visibility:hidden}
.fd .flap.lo{z-index:2;transform:rotateX(90deg);animation:fbot .22s .22s ease-out forwards;backface-visibility:hidden}
@keyframes ftop{to{transform:rotateX(-90deg)}}
@keyframes fbot{to{transform:rotateX(0)}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;border-top:1px dashed var(--dim);padding-top:12px}
.stat{display:flex;flex-direction:column}
.stat b{font-weight:400;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.9rem;color:var(--dim);text-transform:uppercase}
footer{font-size:.95rem;color:var(--dim);text-align:center;margin-top:14px}
@media (max-width:440px){body{font-size:20px}h1{font-size:1.9rem}.q{font-size:1.3rem}.score{font-size:3.6rem}.fd{width:1.7rem;height:2.7rem;font-size:1.9rem}.sep{line-height:2.7rem}.stat span{font-size:.75rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Operator bar, account panel, install line */
.opbar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:1.05rem;color:var(--dim);margin-top:-8px}
.opbar b{color:var(--phos);font-weight:400}
.linkbtn{font:inherit;color:var(--phos);text-shadow:inherit;background:transparent;border:0;padding:0 2px;cursor:pointer}
.linkbtn:hover,.linkbtn:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}
.sync{font-size:.9rem;color:var(--dim)}
.sync.err{color:var(--bad)}
.panel{position:fixed;inset:0;z-index:4;background:rgba(3,4,3,.88);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 48px) 16px 24px;overflow-y:auto}
.panel .screen{width:100%;max-width:460px;gap:14px}
.panel h2{font-weight:400;font-size:1.9rem;letter-spacing:.1em;margin:0;line-height:1}
.panel p{margin:0;font-size:1.15rem}
.panel .dimln{font-size:1rem}
.stack{display:grid;gap:10px}
.btn{font:inherit;font-size:1.3rem;color:var(--phos);text-shadow:inherit;background:transparent;border:1px solid var(--phos);padding:6px 12px;cursor:pointer;text-align:left}
.btn:hover:not(:disabled),.btn:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}
.btn:disabled{opacity:.5;cursor:wait}
.btn.quiet{border-color:var(--dim);color:var(--dim)}
.or{color:var(--dim);font-size:1rem;text-align:center}
.field{display:grid;gap:4px}
.field label{font-size:1rem;color:var(--dim)}
.field input{font:inherit;font-size:1.5rem;color:var(--phos);text-shadow:inherit;background:var(--room);border:1px solid var(--dim);border-radius:0;padding:6px 10px;width:100%;caret-color:var(--phos)}
.field input:focus{outline:0;border-color:var(--phos)}
.msg{min-height:1.2em;font-size:1.05rem}
.msg.err{color:var(--bad)}
.install{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:.95rem;color:var(--dim)}
.panel .screen.wide{max-width:600px}
.stickybar{position:sticky;top:calc(-48px - env(safe-area-inset-top,0px));z-index:2;display:flex;align-items:center;gap:12px;
  background:var(--crt);margin:-22px -20px 0;padding:18px 20px 12px;border-bottom:1px dashed var(--dim);border-radius:12px 12px 0 0;box-shadow:0 -60px 0 var(--crt)}
.stickybar h2{min-width:0;overflow-wrap:anywhere;font-size:1.6rem;letter-spacing:.06em}
@media (max-width:440px){.stickybar h2{font-size:1.4rem;letter-spacing:.03em}.backbtn{font-size:1.3rem;padding:4px 10px}}
.backbtn{flex:none;font-size:1.5rem;line-height:1;border:1px solid var(--phos);padding:6px 12px;min-height:40px}
.panel h3{font-weight:400;font-size:1.25rem;letter-spacing:.08em;margin:10px 0 0;padding-top:12px;border-top:1px dashed var(--dim)}
.panel h3::before{content:">: ";color:var(--dim)}
.opbtns{display:flex;gap:6px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tile{border:1px solid var(--rule);padding:8px 4px;display:flex;flex-direction:column}
.tile b{font-weight:400;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:.85rem;color:var(--dim)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day{border:1px solid var(--phos);padding:4px 0;display:flex;flex-direction:column}
.day.off{border-color:var(--rule);color:var(--dim)}
.day b{font-weight:400;font-size:1.5rem;line-height:1}
.day span{font-size:.8rem;color:var(--dim)}
.srows{display:grid;gap:2px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto 3.2em 3.4em;gap:8px;align-items:baseline;font-size:1.1rem;font-variant-numeric:tabular-nums}
.srow .sl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sb{color:var(--phos);letter-spacing:-.05em;white-space:nowrap}
.srow .sp{text-align:right;white-space:nowrap}
.srow .sn{white-space:nowrap}
.srow .sn{color:var(--dim);font-size:.95rem}
.srow.none{color:var(--dim)}.srow.none .sb{color:var(--rule)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swh{color:var(--dim);font-size:1rem;margin:0 0 4px}
.swi{margin:0;font-size:1.15rem}
.swi span{color:var(--dim)}
.swi.bad{color:var(--bad)}
@media (max-width:440px){.srow{grid-template-columns:minmax(0,1fr) auto 2.9em 3em;gap:6px;font-size:1rem}.sw{grid-template-columns:1fr}.tile b{font-size:1.6rem}}
.flist{display:grid;gap:2px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font:inherit;font-size:1.2rem;color:var(--phos);text-shadow:inherit;background:transparent;border:0;border-bottom:1px dotted var(--rule);padding:5px 2px;text-align:left;width:100%}
.frow.me .fn{color:var(--phos)}
.frow .fn{min-width:0;overflow-wrap:anywhere}
.frow .fa{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.frow .fa b{font-weight:400}
.fbtn{cursor:pointer}
.fbtn:hover,.fbtn:focus-visible{background:var(--phos);color:var(--crt);text-shadow:none;outline:0}
.fbtn:hover .dimtxt,.fbtn:focus-visible .dimtxt{color:var(--crt)}
.dimtxt{color:var(--dim)}
.chev{color:var(--dim)}
.act{font-size:1.15rem}
.quietb{color:var(--dim)}
.sq{display:inline-flex;gap:3px}
.sq i{display:inline-block;width:.6em;height:.6em}
.sq i.g{background:var(--phos)}
.sq i.b{border:1px solid var(--bad);background:transparent}
.crows{display:grid;gap:2px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 5.2em 5.2em;gap:8px;align-items:baseline;font-size:1.15rem;font-variant-numeric:tabular-nums;border-bottom:1px dotted var(--rule);padding:2px 0}
.crow .cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cv{text-align:right}
.crow .cv.lose{color:var(--dim)}
.crow .cv.win{color:var(--phos)}
.crow .cv.win::before{content:"▸ ";font-size:.8em}
.crow.chead .cv{color:var(--dim);font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hh{font-weight:400;color:var(--phos)}
.danger{color:var(--bad);border-color:var(--bad)}
.danger:hover:not(:disabled),.danger:focus-visible{background:var(--bad);color:var(--crt)}
@media (max-width:440px){.crow{grid-template-columns:minmax(0,1fr) 4.4em 4.4em;font-size:1.05rem}.frow{font-size:1.1rem}}
.ln.namaste{margin-top:6px;letter-spacing:.06em}
.gbtn{min-height:44px;display:flex;align-items:center;color-scheme:normal;text-shadow:none}
</style>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>

<body>
<div class="wrap">
 <div class="screen">
  <header>
    <h1>DAILY DHARMA</h1>
    <div class="meta">ORIENTATION <b id="dayno">#1</b><br><span id="datestr"></span></div>
  </header>
  <div class="opbar" id="opbar" hidden>
    <span>OPERATOR: <b id="opName">GUEST</b> <span class="sync" id="opSync"></span></span>

      <div class="stat"><b id="sBest">0</b><span>Best streak</span></div>
    </div>
  </section>
 </div>
 <footer>SIX QUESTIONS DAILY, ONE FOR EACH NUMBER. NEW SET AT MIDNIGHT. UNOFFICIAL FAN QUIZ. <a href="privacy.html" style="color:inherit">PRIVACY</a></footer>
 <div class="install" id="installRow" hidden></div>
</div>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" hidden>
  <div class="screen" id="panelBody"></div>
</div>

<script>

const S1="Season 1",S2="Season 2",S3="Season 3",S4="Season 4",S5="Season 5",S6="Season 6";

const NUMS=[4,8,15,16,23,42], PER_DAY=6, EPOCH=new Date(2026,9,9); // day #1
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  ["Juliet",/\bJuliet\b/],["Richard",/\bRichard\b/],["Jacob",/\bJacob\b/],["Man in Black",/Man in Black/],["Faraday",/Faraday/],["Miles",/\bMiles\b/],
  ["Charlotte",/\bCharlotte\b/],["Frank",/Lapidus|\bFrank\b/],["Widmore",/\bWidmore\b/],["Eloise",/Eloise|Hawking/],["Rose & Bernard",/\bRose\b|\bBernard\b/],
  ["Ana Lucia",/Ana Lucia/],["Mr. Eko",/\bEko\b/],["Libby",/\bLibby\b/],["Shannon",/\bShannon\b/],["Boone",/\bBoone\b/],["Rousseau",/Rousseau|\bAlex\b/]];
function tagsFor(b){
  const text=b[1]+" "+b[2], plain=text.replace(/Christian Shephard/g,""), chars=[];
  if(/Christian/.test(text))chars.push("Christian");
  for(const[n,re]of CHARS)if(re.test(plain)&&!chars.includes(n))chars.push(n);
  const m=/^Season (\d)/.exec(b[0]);
  return{chars,season:m?+m[1]:(b[6]||0),type:m?"Island Trivia":b[0]};
}
const META=BANK.map(b=>({id:qid(b[1]),...tagsFor(b)}));
const BY_ID=Object.fromEntries(META.map((m,i)=>[m.id,i]));
function makeQ(bi,n,qi){const b=BANK[bi],opts=shuffle([b[2],b[3],b[4],b[5]],n*108+qi+42);return{...META[bi],era:b[0],q:b[1],opts,answer:opts.indexOf(b[2])}}
function questionsFor(n){
  const per=Math.floor(BANK.length/PER_DAY), idx=n-1, round=Math.floor(idx/per), slot=idx%per;
  const order=shuffle(BANK.map((_,i)=>i),815+round*4242);
  return order.slice(slot*PER_DAY,slot*PER_DAY+PER_DAY).map((bi,qi)=>makeQ(bi,n,qi));

// A day already started keeps its exact questions, even if the bank grows later.

// Split-flap clock: six black tiles (HH MM SS); each changed digit flips its top half down, then the new bottom half falls into place.
let digits=[],tickTimer=null;
function buildClock(){
  const el=$("cd");const grp=lab=>`<div class="grp"><div class="tiles">${'<div class="fd"><div class="h hi"><b>0</b></div><div class="h lo"><b>0</b></div></div>'.repeat(2)}</div><small>${lab}</small></div>`;
  el.innerHTML=grp("HRS")+'<span class="sep">:</span>'+grp("MIN")+'<span class="sep">:</span>'+grp("SEC");
  digits=[...el.querySelectorAll(".fd")].map(node=>({node,v:null}));
}
function setDigit(d,v){
  if(d.v===v)return;const old=d.v===null?v:d.v;d.v=v;const n=d.node;
  const hi=n.querySelector(".hi:not(.flap) b"),lo=n.querySelector(".lo:not(.flap) b");
  n.querySelectorAll(".flap").forEach(f=>f.remove());
  if(reduceMotion||old===v){hi.textContent=v;lo.textContent=v;return}
  hi.textContent=v;lo.textContent=old;
  n.insertAdjacentHTML("beforeend",`<div class="h hi flap"><b>${old}</b></div><div class="h lo flap"><b>${v}</b></div>`);
  setTimeout(()=>{lo.textContent=v;n.querySelectorAll(".flap").forEach(f=>f.remove())},460);
}
function tick(){clearTimeout(tickTimer);if(!$("cd"))return;const t=new Date(today);t.setDate(t.getDate()+1);let ms=t-new Date();if(ms<=0){location.reload();return}
  const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  const str=[h,m,s].map(v=>String(v).padStart(2,"0")).join("");
  digits.forEach((d,i)=>setDigit(d,str[i]));
  tickTimer=setTimeout(tick,1000-(Date.now()%1000)+5)}

// ---------- Stats (computed from the full history, so they match on every device) ----------
function streaks(hist=data.history){
  const days=Object.keys(hist).filter(k=>hist[k]&&hist[k].done).sort();
  let best=0,run=0,prev=null;
  for(const k of days){run=(prev&&Math.round((parseYmd(k)-parseYmd(prev))/864e5)===1)?run+1:1;best=Math.max(best,run);prev=k}
  const y=new Date(today);y.setDate(y.getDate()-1);
  const cur=(prev===key||prev===ymd(y))?run:0;
  return{days,cur,best};
}
function stats(){
  const{days,cur,best}=streaks();
  $("sPlayed").textContent=days.length;
  $("sAvg").textContent=days.length?Math.round(days.reduce((s,k)=>s+(data.history[k].score||0),0)/(days.length*PER_DAY)*100)+"%":"–";
  $("sStreak").textContent=cur;
  $("sBest").textContent=best;
}

  const BLOCKS=20, barText=k=>`[${"█".repeat(k)}${"░".repeat(BLOCKS-k)}] ${String(Math.round(k/BLOCKS*100)).padStart(3," ")}%`;

const better=(a,b)=>{if(!a)return b;if(!b)return a;if(!!a.done!==!!b.done)return a.done?a:b;return(a.picks?.length||0)>=(b.picks?.length||0)?a:b};
const sameDay=(a,b)=>a&&b&&!!a.done===!!b.done&&(a.picks||[]).join()===(b.picks||[]).join()&&(a.qids||[]).join()===(b.qids||[]).join();
const dayRecord=w=>({picks:[...(w.picks||[])],score:w.score||0,done:!!w.done,qids:[...(w.qids||[])],ok:(w.ok||[]).map(Number)});

async function syncAll(){
  const uid=session.user.id;setSync("SYNCING");
  const{data:rows,error}=await sb.from("results").select("day,picks,score,done,qids,ok").eq("user_id",uid);
  if(error)throw error;
  const remote={};rows.forEach(r=>remote[r.day]=dayRecord(r));
  const up=[];
  new Set([...Object.keys(remote),...Object.keys(data.history)]).forEach(k=>{
    const l=data.history[k],r=remote[k],w=better(l,r);
    data.history[k]=dayRecord(w);
    if(!sameDay(data.history[k],r))up.push({user_id:uid,day:k,...data.history[k]});
  });
  if(up.length){const{error:e2}=await sb.from("results").upsert(up,{onConflict:"user_id,day"});if(e2)throw e2}
  save(data);setSync("SYNCED");
}

async function sendRequest(raw){
  const name=raw.trim();
  if(!/^[A-Za-z0-9_]{3,16}$/.test(name))return{err:"Usernames are 3 to 16 letters, numbers or underscores."};
  if(profile&&name.toLowerCase()===profile.username.toLowerCase())return{err:"That's you. Try a friend's username."};
  const{data:p,error}=await sb.from("profiles").select("id,username").ilike("username",name.replace(/[\\%_]/g,c=>"\\"+c)).maybeSingle();
  if(error)return{err:"Couldn't search right now. Check your connection."};
  if(!p)return{err:`No operator named ${name}. Check the spelling.`};
  social.names[p.id]=p.username;
  const L=socialLists();
  if(L.friends.includes(p.id))return{err:`You and ${p.username} are already friends.`};
  if(L.outgoing.includes(p.id))return{err:`You already sent ${p.username} a request.`};
  if(L.incoming.includes(p.id)){const r=await acceptRequest(p.id);return r.err?r:{ok:`${p.username} had already asked you. You're now friends.`}}
  const{error:e2}=await sb.from("friendships").insert({requester:myId(),addressee:p.id});
  if(e2)return{err:e2.code==="23505"?"There's already a request between you two. Tap REFRESH.":"Couldn't send the request. Try again."};
  await loadSocial().catch(()=>{});
  return{ok:`Request sent to ${p.username}. You'll see each other's stats once they accept.`};
}

// ---------- Stats: computed from every answer saved in the history ----------
const MIN_SAMPLE=3;
function tally(){const g={};return{add(k,ok){(g[k]||(g[k]={n:0,c:0})).n++;g[k].c+=ok},get:k=>g[k]||{n:0,c:0},all:()=>g}}
function computeStats(hist=data.history){
  const seasons=tally(),types=tally(),chars=tally(),slots=tally();
  let n=0,c=0;
  const days=Object.keys(hist).sort();
  for(const k of days){
    const h=hist[k];if(!h||!h.qids)continue;
    (h.ok||[]).forEach((o,i)=>{
      const bi=BY_ID[h.qids[i]];if(bi===undefined)return;
      const m=META[bi];o=+o;n++;c+=o;
      if(m.season)seasons.add(m.season,o);
      types.add(m.type,o);slots.add(i,o);
      m.chars.forEach(ch=>chars.add(ch,o));
    });
  }
  const games=days.filter(k=>hist[k]?.done);
  const dist=[0,0,0,0,0,0,0];games.forEach(k=>dist[hist[k].score||0]++);
  const{cur,best}=streaks(hist);
  // Strengths and weaknesses: rank areas with enough answers by smoothed accuracy.
  const areas=[];
  for(const[s,v]of Object.entries(seasons.all()))areas.push({label:"Season "+s,...v});
  for(const[s,v]of Object.entries(types.all()))areas.push({label:s,...v});
  for(const[s,v]of Object.entries(chars.all()))areas.push({label:s,...v});
  const ranked=areas.filter(a=>a.n>=MIN_SAMPLE).map(a=>({...a,p:a.c/a.n,r:(a.c+1)/(a.n+2)})).sort((a,b)=>b.r-a.r||b.n-a.n);
  const strengths=ranked.filter(a=>a.p>=0.6).slice(0,3);
  const weaknesses=ranked.filter(a=>a.p<0.6&&!strengths.includes(a)).slice(-3).reverse();
  return{n,c,games,dist,cur,best,seasons,types,chars,slots,strengths,weaknesses,perfect:dist[6]};
}
const pct=(c,n)=>n?Math.round(c/n*100)+"%":"–";
function bar(c,n,w=8){if(!n)return"░".repeat(w);const f=Math.round(c/n*w);return"█".repeat(f)+"░".repeat(w-f)}
function srow(label,v){return`<div class="srow${v.n?"":" none"}"><span class="sl">${esc(label)}</span><span class="sb" aria-hidden="true">${bar(v.c,v.n)}</span><span class="sp">${v.n?pct(v.c,v.n):"–"}</span><span class="sn">${v.n?v.c+"/"+v.n:""}</span></div>`}
function tipFor(l){
  if(/^Season /.test(l))return`Rewatch tip: go back to ${esc(l)}.`;
  if(l==="Episode Titles")return"Tip: skim the episode list. Titles are a weak spot.";
  if(l==="Complete the Quote"||l==="Who Said It")return"Tip: rewatch with the dialogue in mind. Quotes are a weak spot.";
  if(l==="Timeline")return"Tip: brush up on when the big moments happen.";
  if(l==="Island Trivia")return"Tip: Island details are a weak spot.";
  return`Tip: rewatch the ${esc(l)} episodes.`;
}

      ${S.weaknesses[0]?`<p class="dimln">${tipFor(S.weaknesses[0].label)}</p>`:""}`;
  const seasonRows=[1,2,3,4,5,6].map(s=>srow("Season "+s,S.seasons.get(s))).join("");
  const typeRows=["Island Trivia","Complete the Quote","Who Said It","Episode Titles","Timeline"].map(t=>srow(t,S.types.get(t))).join("");

  const maxD=Math.max(1,...S.dist);

  const last7=[...Array(7)].map((_,i)=>{const d=new Date(today);d.setDate(d.getDate()-6+i);const h=data.history[ymd(d)];

  return`<div class="stickybar"><button class="linkbtn backbtn" id="pBackTop" type="button" aria-label="Back to the game">[ &lt; ]</button><h2 id="panelTitle">${head}</h2></div>

    <h3>BY QUESTION TYPE</h3><div class="srows">${typeRows}</div>

    <h3>SCORE HISTORY</h3><div class="srows">${distRows}</div>
    ${account}

  const sent=L.outgoing.length?`<h3>SENT REQUESTS</h3><div class="flist">${L.outgoing.map(id=>`<div class="frow"><span class="fn">${esc(nameOf(id).toUpperCase())}</span><span class="fa"><span class="dimtxt">PENDING</span><button class="linkbtn act quietb" data-act="cancel" data-id="${id}" type="button">[ CANCEL ]</button></span></div>`).join("")}</div>`:"";
  return`<div class="stickybar"><button class="linkbtn backbtn" id="pBackTop" type="button" aria-label="Back to the game">[ &lt; ]</button><h2 id="panelTitle">SOCIAL</h2></div>
    <p class="dimln">Add friends to compare scores and stats. You only see each other's results after a request is accepted.</p>
    <h3>ADD A FRIEND</h3>
    <form class="stack" id="pAddForm" novalidate>
      <div class="field"><label for="pFriend">FRIEND'S USERNAME</label><input id="pFriend" type="text" maxlength="16" autocapitalize="off" autocomplete="off" spellcheck="false" required></div>
      <button class="btn" type="submit">&gt; SEND REQUEST</button>
    </form>
    <p class="msg${note?.err?" err":""}" id="pMsg" aria-live="polite">${esc(note?.err||note?.ok||"")}</p>
    ${loading?'<p class="dimln">LOADING FRIENDS...</p>':`${reqs}
    <h3>TODAY'S BOARD · #${dayNo}</h3>
    ${!played&&L.friends.length?'<p class="dimln">Finish today\'s orientation to see your friends\' scores.</p>':""}
    <div class="flist">${boardRows}</div>
    <h3>FRIENDS (${L.friends.length})</h3>
    ${L.friends.length?`<div class="flist">${friendRows}</div>`:'<p class="dimln">No friends yet. Send a request above.</p>'}
    ${sent}`}
    <div class="stack"><button class="btn quiet" id="pRefresh" type="button">[ REFRESH ]</button><button class="btn quiet" id="pClose" type="button">[ CLOSE ]</button></div>`;
}
function cmpRow(label,a,b,fmt=v=>v,higherWins=true){
  const av=a.val,bv=b.val,has=a.n!==0||b.n!==0;
  const aw=has&&av!==null&&bv!==null&&(higherWins?av>bv:av<bv),bw=has&&av!==null&&bv!==null&&(higherWins?bv>av:bv<av);
  return`<div class="crow"><span class="cl">${esc(label)}</span><span class="cv${aw?" win":bw?" lose":""}">${av===null?"–":fmt(av)}</span><span class="cv${bw?" win":aw?" lose":""}">${bv===null?"–":fmt(bv)}</span></div>`;
}
const accV=v=>v.n?{val:Math.round(v.c/v.n*100),n:v.n}:{val:null,n:0};
const numV=x=>({val:x,n:1});
function renderFriendPage(id){
  const fh=social.hist[id]||{}, A=computeStats(), B=computeStats(fh), sa=streaks(), sb2=streaks(fh);
  const them=nameOf(id).toUpperCase(), me=(profile?.username||"YOU").toUpperCase();
  const avg=(S,h)=>S.games.length?Math.round(S.games.reduce((s,k)=>s+(h[k].score||0),0)/S.games.length*10)/10:null;
  let w=0,l=0,d=0;Object.keys(data.history).forEach(k=>{const x=data.history[k],y=fh[k];if(x?.done&&y?.done){x.score>y.score?w++:x.score<y.score?l++:d++}});
  const P=v=>v+"%";
  const head=`<div class="crow chead"><span class="cl"></span><span class="cv">${esc(me.slice(0,9))}</span><span class="cv">${esc(them.slice(0,9))}</span></div>`;
  const overview=[cmpRow("Games",numV(A.games.length),numV(B.games.length)),cmpRow("Accuracy",accV({c:A.c,n:A.n}),accV({c:B.c,n:B.n}),P),
    cmpRow("Avg score",numV(avg(A,data.history)),numV(avg(B,fh))),cmpRow("Perfect 6/6",numV(A.perfect),numV(B.perfect)),
    cmpRow("Streak",numV(sa.cur),numV(sb2.cur)),cmpRow("Best streak",numV(sa.best),numV(sb2.best))].join("");
  const td=data.history[key],fd=fh[key];
  const today=!fd?.done?`<p class="dimln">${esc(them)} hasn't played today yet.</p>`:!td?.done?`<p class="dimln">${esc(them)} has played. Finish yours to see the score.</p>`
    :`<div class="flist"><div class="frow me"><span class="fn">${esc(me)}</span><span class="fa"><span class="sq">${squares(td)}</span><b>${td.score}/6</b></span></div><div class="frow"><span class="fn">${esc(them)}</span><span class="fa"><span class="sq">${squares(fd)}</span><b>${fd.score}/6</b></span></div></div>`;
  const seasons=[1,2,3,4,5,6].map(s=>cmpRow("Season "+s,accV(A.seasons.get(s)),accV(B.seasons.get(s)),P)).join("");
  const types=["Island Trivia","Complete the Quote","Who Said It","Episode Titles","Timeline"].map(t=>cmpRow(t,accV(A.types.get(t)),accV(B.types.get(t)),P)).join("");
  const chs=[...new Set([...Object.keys(A.chars.all()),...Object.keys(B.chars.all())])].map(ch=>[ch,A.chars.get(ch).n+B.chars.get(ch).n]).sort((a,b)=>b[1]-a[1]).slice(0,10)
    .map(([ch])=>cmpRow(ch,accV(A.chars.get(ch)),accV(B.chars.get(ch)),P)).join("");
  const sw=B.n<MIN_SAMPLE*3?`<p class="dimln">Not enough data on ${esc(them)} yet.</p>`:`<div class="sw"><div><p class="swh">STRENGTHS</p>${B.strengths.map(a=>`<p class="swi good">+ ${esc(a.label)} <span>${pct(a.c,a.n)}</span></p>`).join("")||'<p class="swi dimln">None yet.</p>'}</div><div><p class="swh">WEAK SPOTS</p>${B.weaknesses.map(a=>`<p class="swi bad">− ${esc(a.label)} <span>${pct(a.c,a.n)}</span></p>`).join("")||'<p class="swi dimln">None found.</p>'}</div></div>`;
  return`<div class="stickybar"><button class="linkbtn backbtn" id="pBackTop" type="button" aria-label="Back to Social">[ &lt; ]</button><h2 id="panelTitle">${esc(me)} VS ${esc(them)}</h2></div>
    <p class="dimln">Head to head on days you both played: <b class="hh">${w}W ${l}L ${d}D</b></p>
    <h3>TODAY · #${dayNo}</h3>${today}
    <h3>OVERVIEW</h3><div class="crows">${head}${overview}</div>
    <h3>BY SEASON</h3><div class="crows">${head}${seasons}</div>
    <h3>BY QUESTION TYPE</h3><div class="crows">${head}${types}</div>
    ${chs?`<h3>BY CHARACTER</h3><div class="crows">${head}${chs}</div>`:""}
    <h3>${esc(them)}'S STRENGTHS &amp; WEAK SPOTS</h3>${sw}
    <p class="msg" id="pMsg" aria-live="polite"></p>
    <div class="stack"><button class="btn quiet danger" id="pRemove" type="button">[ REMOVE FRIEND ]</button><button class="btn quiet" id="pBackBottom" type="button">[ BACK TO SOCIAL ]</button></div>`;
}

// ---------- Account panel ----------
let lastFocus=null, pendingEmail="";
// Google's own sign-in button: the popup names this site, and the login never leaves the page.
// Google gets a hashed nonce; Supabase gets the raw one and checks they match.
async function sha256hex(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function mountGoogleButton(fallback){
  const box=$("pGoogleBtn");if(!box)return;
  const t0=Date.now();
  while(!(window.google&&google.accounts&&google.accounts.id)){if(Date.now()-t0>6000){box.hidden=true;fallback();return}await sleep(100)}
  if(!$("pGoogleBtn"))return;
  try{
    const raw=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
    const hashed=await sha256hex(raw);
    google.accounts.id.initialize({client_id:CFG.googleClientId,nonce:hashed,ux_mode:"popup",itp_support:true,
      callback:async resp=>{
        busy(true);panelMsg("VERIFYING...");
        const{error}=await sb.auth.signInWithIdToken({provider:"google",token:resp.credential,nonce:raw});
        busy(false);
        if(error){panelMsg(error.message,true);return}
        panelMsg("ACCESS GRANTED.");setTimeout(()=>{if(!$("panel").hidden&&$("pGoogleBtn"))closePanel()},600)}});
    box.innerHTML="";
    google.accounts.id.renderButton(box,{type:"standard",theme:"filled_black",size:"large",text:"continue_with",shape:"rectangular",logo_alignment:"left",width:Math.max(200,Math.min(400,box.clientWidth||300))});
  }catch(e){box.hidden=true;fallback()}
}
function closePanel(){$("panel").hidden=true;document.body.style.overflow="";lastFocus?.focus?.()}
function panelMsg(t,err){const m=$("pMsg");if(m){m.textContent=t||"";m.classList.toggle("err",!!err)}}
function busy(on){$("panelBody").querySelectorAll("button,input").forEach(el=>el.disabled=on)}
function openPanel(kind,arg){
  if(kind==="account")kind="stats";
  if(!cloudOn&&kind!=="stats")return;
  if((kind==="social"||kind==="friend")&&!session){kind="login"}
  if($("panel").hidden)lastFocus=document.activeElement;
  $("panel").hidden=false;document.body.style.overflow="hidden";
  const P=$("panelBody"), prov=CFG.providers||{};
  P.classList.toggle("wide",kind==="stats"||kind==="social"||kind==="friend");P.scrollTop=0;$("panel").scrollTop=0;
  const redirectTo=location.origin+location.pathname;
  if(kind==="login"){
    P.innerHTML=`<h2 id="panelTitle">IDENTIFY YOURSELF</h2>
      <p class="dimln">Log in to keep your streak on every device.</p>
      <div class="stack">
        ${prov.google!==false&&CFG.googleClientId?'<div class="gbtn" id="pGoogleBtn" aria-label="Continue with Google"></div>':""}
        ${prov.google!==false?`<button class="btn" id="pGoogle" type="button" ${CFG.googleClientId?"hidden":""}>&gt; CONTINUE WITH GOOGLE</button>`:""}
        ${prov.apple?'<button class="btn" id="pApple" type="button">&gt; CONTINUE WITH APPLE</button>':""}
      </div>
      ${prov.google!==false||prov.apple?'<p class="or">— OR USE YOUR EMAIL —</p>':""}
      <form class="stack" id="pEmailForm" novalidate>
        <div class="field"><label for="pEmail">EMAIL ADDRESS</label><input id="pEmail" type="email" autocomplete="email" inputmode="email" required></div>
        <button class="btn" type="submit">&gt; SEND LOGIN CODE</button>
      </form>
      <p class="msg" id="pMsg" aria-live="polite"></p>
      <button class="btn quiet" id="pClose" type="button">[ CANCEL ]</button>`;
    const oauth=async provider=>{busy(true);panelMsg("CONNECTING...");
      const{error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo}});
      if(error){busy(false);panelMsg(error.message,true)}};
    $("pGoogle")&&($("pGoogle").onclick=()=>oauth("google"));
    $("pApple")&&($("pApple").onclick=()=>oauth("apple"));
    $("pEmailForm").onsubmit=async e=>{e.preventDefault();const email=$("pEmail").value.trim();
      if(!/^\S+@\S+\.\S+$/.test(email)){panelMsg("Enter a valid email address.",true);return}
      busy(true);panelMsg("TRANSMITTING...");
      const{error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:redirectTo}});
      busy(false);
      if(error){panelMsg(error.message,true);return}
      pendingEmail=email;openPanel("code")};
    $("pClose").onclick=closePanel;
    ($("pGoogleBtn")?$("pEmail"):($("pGoogle")||$("pEmail"))).focus();
    if($("pGoogleBtn"))mountGoogleButton(()=>{$("pGoogle")&&($("pGoogle").hidden=false)});
  }
  else if(kind==="code"){
    P.innerHTML=`<h2 id="panelTitle">ENTER THE CODE</h2>
      <p class="dimln">We sent a code to ${esc(pendingEmail)}. It can take a minute to arrive; check spam too.</p>
      <form class="stack" id="pCodeForm" novalidate>
        <div class="field"><label for="pCode">LOGIN CODE</label><input id="pCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required></div>
        <button class="btn" type="submit">&gt; VERIFY</button>
      </form>
      <p class="msg" id="pMsg" aria-live="polite"></p>
      <button class="btn quiet" id="pBack" type="button">[ CHANGE EMAIL ]</button>`;
    $("pCodeForm").onsubmit=async e=>{e.preventDefault();const token=$("pCode").value.replace(/\s/g,"");
      if(token.length<6){panelMsg("Enter the full code from the email.",true);return}
      busy(true);panelMsg("VERIFYING...");
      const{error}=await sb.auth.verifyOtp({email:pendingEmail,token,type:"email"});
      busy(false);
      if(error){panelMsg("That code didn't work. Check it, or request a new one.",true);return}
      panelMsg("ACCESS GRANTED.");setTimeout(()=>{if(!$("panel").hidden&&$("pCode"))closePanel()},700)};
    $("pBack").onclick=()=>openPanel("login");
    $("pCode").focus();
  }
  else if(kind==="username"){
    P.innerHTML=`<h2 id="panelTitle">CHOOSE AN OPERATOR NAME</h2>
      <p class="dimln">This is your username. 3 to 16 letters, numbers or underscores.</p>
      <form class="stack" id="pNameForm" novalidate>
        <div class="field"><label for="pName">USERNAME</label><input id="pName" type="text" autocomplete="username" maxlength="16" autocapitalize="off" spellcheck="false" value="${esc(profile?.username||"")}" required></div>
        <button class="btn" type="submit">&gt; CONFIRM</button>
      </form>
      <p class="msg" id="pMsg" aria-live="polite"></p>
      ${profile?'<button class="btn quiet" id="pBack" type="button">[ BACK ]</button>':""}`;
    $("pNameForm").onsubmit=async e=>{e.preventDefault();const name=$("pName").value.trim();
      if(!/^[A-Za-z0-9_]{3,16}$/.test(name)){panelMsg("Use 3 to 16 letters, numbers or underscores.",true);return}
      busy(true);panelMsg("REGISTERING...");
      const{error}=await sb.from("profiles").upsert({id:session.user.id,username:name});
      busy(false);
      if(error){panelMsg(error.code==="23505"?"That name is taken. Try another.":error.message,true);return}
      profile={username:name};renderOperator();closePanel()};
    $("pBack")&&($("pBack").onclick=()=>openPanel("account"));
    $("pName").focus();
  }
  else if(kind==="stats"){
    P.innerHTML=renderStatsPage();
    $("pClose").onclick=closePanel;
    $("pBackTop").onclick=closePanel;
    $("pShowChars")&&($("pShowChars").onclick=()=>{$("charsMore").hidden=false;$("pShowChars").remove()});
    $("pRename")&&($("pRename").onclick=()=>openPanel("username"));
    $("pOut")&&($("pOut").onclick=async()=>{busy(true);await sb.auth.signOut();closePanel()});
    $("pLogin")&&($("pLogin").onclick=()=>openPanel("login"));
    const h=$("panelTitle");h.tabIndex=-1;h.focus({preventScroll:true});
  }
  else if(kind==="social"){
    const draw=(note,keepFocus)=>{
      if($("panel").hidden)return;
      const typed=$("pFriend")?.value||"", y=$("panel").scrollTop;
      P.innerHTML=renderSocialPage(note);
      $("pFriend").value=typed;$("panel").scrollTop=y;
      $("pBackTop").onclick=closePanel;$("pClose").onclick=closePanel;
      $("pRefresh").onclick=async()=>{busy(true);panelMsg("REFRESHING...");try{await loadSocial();draw({ok:"Up to date."})}catch(e){draw({err:"Couldn't refresh. Check your connection."})}};
      $("pAddForm").onsubmit=async e=>{e.preventDefault();busy(true);panelMsg("SEARCHING...");
        const r=await sendRequest($("pFriend").value);if(r.ok)$("pFriend").value="";draw(r,true);$("pFriend").focus()};
      P.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
        const id=b.dataset.id,act=b.dataset.act;
        if(act==="compare"){openPanel("friend",id);return}
        busy(true);panelMsg("UPDATING...");
        const r=act==="accept"?await acceptRequest(id):await removeLink(id);
        draw(r.err?r:{ok:act==="accept"?r.ok:act==="decline"?"Request declined.":"Request cancelled."});
      });
      if(!keepFocus){const h=$("panelTitle");h.tabIndex=-1;h.focus({preventScroll:true})}
    };
    draw();
    loadSocial().then(()=>draw(null,true)).catch(()=>draw({err:"Couldn't load friends. Check your connection."},true));
  }
  else if(kind==="friend"){
    P.innerHTML=renderFriendPage(arg);
    const back=()=>openPanel("social");
    $("pBackTop").onclick=back;$("pBackBottom").onclick=back;
    let armed=false;
    $("pRemove").onclick=async()=>{
      if(!armed){armed=true;$("pRemove").textContent=`[ TAP AGAIN TO REMOVE ${nameOf(arg).toUpperCase()} ]`;return}
      busy(true);panelMsg("REMOVING...");const r=await removeLink(arg);
      if(r.err){busy(false);panelMsg(r.err,true);return}
      openPanel("social");
    };
    const h=$("panelTitle");h.tabIndex=-1;h.focus({preventScroll:true});
  }
}
$("opBtn").onclick=()=>openPanel(session?"stats":"login");
$("statsBtn").onclick=()=>openPanel("stats");
$("socialBtn").onclick=()=>openPanel("social");
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("panel").hidden&&(profile||!session))closePanel()});

// ---------- PWA: offline cache and install prompts ----------
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(function(){
  const row=$("installRow"), standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(standalone)return;
  const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(iOS){row.textContent="INSTALL: TAP SHARE, THEN ADD TO HOME SCREEN";row.hidden=false;return}
  let deferred=null;
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;
    row.innerHTML='<button class="linkbtn" id="installBtn" type="button">[ INSTALL APP ]</button>';row.hidden=false;
    $("installBtn").onclick=async()=>{deferred.prompt();await deferred.userChoice;deferred=null;row.hidden=true}});
  addEventListener("appinstalled",()=>{row.hidden=true});
})();

stats();intro();
